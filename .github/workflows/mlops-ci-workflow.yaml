name: MLOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q src streamlit_app

      - name: Process data
        run: python src/data/run_processing.py

      - name: Engineer features
        run: |
          python src/features/engineer.py \
            --input data/processed/cleaned_house_data.csv \
            --output data/processed/featured_house_data.csv \
            --preprocessor models/trained/preprocessor.pkl

      - name: Start MLflow with Docker Compose
        run: docker compose -f deployment/mlflow/docker-compose.yaml up --detach

      - name: Wait for MLflow
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:5555/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "MLflow server did not become ready" >&2
              exit 1
            fi
            sleep 1
          done

      - name: Train model
        run: |
          python src/models/train_model.py \
            --config configs/model_config.yaml \
            --data data/processed/featured_house_data.csv \
            --models-dir models \
            --mlflow-tracking-uri http://127.0.0.1:5555

      - name: Stop MLflow
        if: always()
        run: docker compose -f deployment/mlflow/docker-compose.yaml down

      - name: Validate API image build
        if: github.event_name == 'pull_request'
        run: docker build --tag house-price-predictor:validation .

      - name: Upload trained model
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            models/trained/house_price_model.pkl
            models/trained/preprocessor.pkl
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models/trained

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
